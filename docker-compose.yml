services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: quickwish
      POSTGRES_PASSWORD: quickwish_local
      POSTGRES_DB: quickwish
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["quickwish-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickwish -d quickwish"]
      interval: 5s
      retries: 10
volumes:
  quickwish-db:
